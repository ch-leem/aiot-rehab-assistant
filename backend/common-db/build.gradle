// backend/common-db/build.gradle

plugins {
    id 'java-library'
    id 'org.springframework.boot' // 버전 생략 (루트에서 관리)
    id 'io.spring.dependency-management' // 버전 생략
}

bootJar { enabled = false } 
jar { enabled = true }

dependencies {
    // api를 사용하여 backend-user가 별도의 jpa 설정 없이도 엔티티/리포지토리를 인식하게 함
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    
    runtimeOnly 'org.postgresql:postgresql'
}