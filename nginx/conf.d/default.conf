
server {
    listen 80;
    server_name i14a203.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "http ok\n";
    }
}

server {
    listen 443 ssl;
    server_name i14a203.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/i14a203.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i14a203.p.ssafy.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /test/ {
        proxy_pass http://frontend-test:8080/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/ingest/events {
        proxy_pass http://ingest-api:8000/events;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE 핵심
        proxy_buffering off;
        proxy_cache off;

        # 끊김 방지(길게)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # 🔥 Jenkins (path-based)
    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }


    # 프론트
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 라우팅
    location /api/user/ {
        proxy_pass http://user-api:8080/;
    }
    location /api/iot/ {
        proxy_pass http://iot-api:8080/;
    }
    location /api/ingest/ {
        proxy_pass http://ingest-api:8000/;
    }
}
